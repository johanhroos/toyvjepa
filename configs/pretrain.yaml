defaults:
  - pretrain_config
  - arch: small
  - data@data.ssv2: ssv2
  - data@data.imagenet: imagenet
  - _self_


paths:
  project_root: ${hydra:runtime.cwd}
  data_root: ${paths.project_root}/data
  output_dir: ${hydra:runtime.output_dir}

hydra:
    run:
      dir: outputs/pretrain/${now:%d-%m-%Y}/${now:%H-%M-%S}_${arch.name}
    sweep:
      dir: outputs/pretrain/${now:%d-%m-%Y}/${now:%H-%M-%S}_${arch.name}_sweep
      subdir: ${optim.name}-lr${optim.lr}-s${trainer.seed}
    job:
      chdir: false


trainer:
    run_name: null
    seed: 0
    compile: true
    train_split: train
    val_split: validation
    val_dataset: ssv2
    train_shuffle: true
    val_shuffle: true
    devices: 1
    accelerator: cuda
    epochs: 24
    # -1 trains all epochs
    stop_at_epoch: -1
    precision: bf16
    gradient_accumulation_steps: 8
    val_check_interval: 1024
    num_val_batches: 512
    log_every: 32
    diagnostics_interval: 128
    # first validation batches used for the per-layer attention and activation diagnostics
    diagnostic_batches: 8
    probe_every: 1

# logging:

checkpoint:
    dir: ${paths.output_dir}/checkpoints
    resume_path: null
    fork_wandb_run: false

loader:
    # On RTX5090: 32768 is good for base. 50176 good for small
    token_budget: 50176
    prefetch_factor: 2
    num_workers: 8
    pin_memory: true

mask:
    enabled: true
    policy_weights: [0.5, 0.5]

probe:
    dataset: ssv2
    train_split: train
    val_split: validation
    epochs: 20
    seed: 1337
    log_every: 10
    max_train_batches: null
    max_val_batches: null
    num_classes: 174
    dropout: 0.0
    batch_size: 4096
    cache_dtype: float16
    optim:
      lr: 1e-3
      final_lr: 1e-6
      betas: [0.9, 0.999]
      wd: 0.0
      eps: 1e-8

loss:
    lambda_context: 0.5
    temporal_scale: 1.0
    eps: 1e-6

ema:
    momentum: 0.999

optim:
    name: muon
    start_lr: 1e-4
    warmup_ratio: 0.10
    cooldown_ratio: 0.15
    # value after warmup
    lr: 6e-4
    final_lr: 1e-4
    betas: [0.9, 0.999]
    wd: 0.04
    eps: 1e-8
