[project]
name = "temujepa"
version = "0.1.0"
description = "AdamW vs. Muon for V-JEPA-style self-supervised video pretraining"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "albumentations>=2.0.8",
    "datasets>=3.0.0",
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "hydra-core>=1.3.3",
    "ipykernel>=7.2.0",
    "ipython>=9.10.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "psutil>=7.2.2",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "timm>=1.0.25",
    "torch>=2.11.0",
    "torchcodec>=0.14.0",
    "torchvision>=0.26.0",
    "transformers>=5.5.0",
    "wandb>=0.25.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

torchcodec = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
extend-exclude = [
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".vscode",
    "build",
    "site-packages",
]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = [
# Pycodestyle
"E4",    # Import and whitespace errors
"E7",    # Statement errors
"E9",    # Syntax and runtime errors
"E101",  # Mixed spaces and tabs
"E501",  # Line too long
# Core correctness
"F",     # Pyflakes
"B",     # Flake8-bugbear
"PLE",   # Serious Pylint errors
# Imports and modernization
"I",     # Import sorting
"UP",    # Modern Python syntax
"PTH",   # Prefer pathlib
# Code quality
"C4",    # Better comprehensions
"RET",   # Return-statement consistency
"RSE",   # Raise-statement cleanup
"PIE",   # Miscellaneous unnecessary/problematic code
"SIM",   # Simplifiable code
"PERF",  # Common performance mistakes
"RUF",   # Ruff-specific checks
# Documentation
"D",     # Pydocstyle

]
ignore = [
# Check the style of existing docstrings without requiring docstrings
# on every module, class, method, and function.
"D100", # Missing module docstring
"D101", # Missing public class docstring
"D102", # Missing public method docstring
"D103", # Missing public function docstring
"D104", # Missing package docstring
"D105", # Missing magic-method docstring
"D106", # Missing public nested-class docstring
"D107", # Missing init docstring
]
exclude = ["*.ipynb"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "jedi-language-server>=0.47.0",
    "jupyterlab-git>=0.54.0",
    "jupyterlab-lsp>=5.3.0",
    "jupyterlab-vim>=4.1.4",
    "ruff>=0.15.18",
]
